[project]
name = "corridas-distribuidas-api"
version = "0.1.0"
description = "API para o projeto de corridas distribuidas, referente ao trabalho final da disciplina de sistemas distribuidos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.1",
    "bcrypt>=4.0.1",
    "fastapi[standard]>=0.112.1",
    "httptools>=0.6.1",
    "openrouteservice<=2.3.3",
    "pika>=1.3.0",
    "pymysql>=1.1.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.44",
]
