version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb-corridas
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: fastapi
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-pmypass"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-corridas
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO: Adicionar serviços para múltiplos nós da aplicação
  # node-1:
  #   build: .
  #   environment:
  #     NODE_ID: node-1
  #     REGION: us-east-1
  #     DB_URL: mariadb+pymysql://root:mypass@mariadb:3306/fastapi
  #     RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
  #   depends_on:
  #     - mariadb
  #     - rabbitmq
  #   ports:
  #     - "8000:8000"

volumes:
  mariadb_data:
  rabbitmq_data:

